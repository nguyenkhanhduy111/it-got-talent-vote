# Triển khai miễn phí lên Render: Dashboard → New → Blueprint → chọn repo này.
databases:
  - name: gdta-db
    plan: free
    databaseName: gdta

services:
  - type: web
    name: it-got-talent-vote
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false          # điền https://<tên-dịch-vụ>.onrender.com sau lần deploy đầu
      - key: MAIL_BRIDGE_URL
        sync: false          # https://penguinstudio1405.online/send-code.php
      - key: MAIL_BRIDGE_TOKEN
        sync: false          # chuỗi bí mật trùng SECRET_TOKEN trong send-code.php
      - key: BREVO_API_KEY
        sync: false          # khóa API Brevo để gửi mã xác nhận về Gmail khán giả
      - key: MAIL_FROM
        sync: false          # địa chỉ email người gửi đã xác minh trên Brevo
      - key: MAIL_FROM_NAME
        value: IT GOT TALENT
      - key: CODE_PEPPER
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SCREEN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gdta-db
          property: connectionString
